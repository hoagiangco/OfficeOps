<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Main Printer Icon -->
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(36, 40) scale(0.24)">
    <!-- Printer top paper -->
    <path d="M100 0 h300 v120 h-300 z" fill="#e0f2fe"/>
    <!-- Printer body -->
    <path d="M40 100 h420 a40 40 0 0 1 40 40 v180 a30 30 0 0 1 -30 30 h-440 a30 30 0 0 1 -30 -30 v-180 a40 40 0 0 1 40 -40 z" fill="#ffffff"/>
    <!-- Paper tray bottom -->
    <path d="M80 280 h340 v120 a20 20 0 0 1 -20 20 h-300 a20 20 0 0 1 -20 -20 z" fill="#bae6fd"/>
    <!-- Status light -->
    <circle cx="430" cy="180" r="16" fill="#10b981"/>
    <!-- Feed line -->
    <rect x="130" y="320" width="240" height="16" rx="8" fill="#0284c7"/>
    <rect x="150" y="355" width="200" height="14" rx="7" fill="#0369a1"/>
    <!-- Gear wrench accent -->
    <circle cx="390" cy="360" r="45" fill="#f59e0b"/>
    <path d="M375 345 l30 30 m0 -30 l-30 30" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
